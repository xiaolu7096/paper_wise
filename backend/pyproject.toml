[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwise-backend"
version = "1.2.0"
description = "Local-first paper reading assistant backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "pillow",
  "pydantic-settings",
  "pymupdf",
  "python-multipart",
  "uvicorn[standard]",
]

[project.optional-dependencies]
retrieval = [
  "numpy",
  "sentence-transformers",
]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "../data/.ruff-cache"
